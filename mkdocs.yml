site_name: AgentAuditKit Documentation
site_description: Security scanner for MCP-connected AI agent pipelines
site_url: https://sattyamjjain.github.io/agent-audit-kit/docs/
repo_url: https://github.com/sattyamjjain/agent-audit-kit
repo_name: agent-audit-kit

theme:
  name: material
  palette:
    primary: red
    accent: orange
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight

# Overrides on top of the theme; see the comments in the file itself.
extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Getting started: getting-started.md
      - CLI reference: cli.md
      - Configuration & rule schema: rule-schema.md
      - Scan a container image's files: scan-image-rootfs.md
  - Rules & coverage:
      - Per-rule pages: rules/index.md
      - OWASP mapping: owasp-mapping.md
      - OWASP Agentic coverage: owasp-agentic-coverage.md
      - Session transcripts: session-transcripts.md
  - Compliance & evidence:
      - VEX and SBOM: vex.md
      - Why it works this way: why.md
  - CI/CD:
      - GitHub Action: github-action.md
      - CI/CD integration: ci-cd.md
      - GitLab CI: gitlab-ci.md
      - Azure Pipelines: azure-pipelines.md
      - CircleCI: circleci.md
  - Security & process:
      - Disclosure policy: disclosure-policy.md
      - CVE triage: cve-triage.md
      - CVE-to-rule latency: cve-latency.md
      - Releasing: RELEASING.md
      - Metrics: metrics.md
  - Research:
      - Coverage & crosswalk: STATE-OF-MCP-SECURITY-2026.md
      - 'The State of MCP Security, 2026 (corpus study)': research/state-of-mcp-2026/REPORT.md
      - Prevalence & score calibration: research/state-of-mcp-2026/PREVALENCE.md
      - Research log: research-log.md
  - Comparison: comparisons.md

# `research/state-of-mcp-2026/` lives outside docs/, so MkDocs cannot see it and
# the corpus study had no https address. The hook adds those files to the build
# from where they already are — one source of truth, no copy in the tree.
#
# The same hook generates one page per rule in the registry (`docs/rules/<ID>/`,
# the target of every SARIF `helpUri`) and appends the full list to
# `docs/rules/index.md`. Nothing generated is committed; a hand-written
# `docs/rules/<ID>.md` is shown verbatim with the registry reference below it.
#
# It also gives the labels of every `Field | Value` table a row header
# (`<th scope="row">`) in the built HTML, so the Markdown stays a plain table on GitHub.
hooks:
  - scripts/mkdocs_hooks.py

# `def_list` renders the facts block of every rule page (Severity, Category, ...)
# as a description list, which a screen reader announces term by term; a
# two-column Markdown table has no row headers. tests/test_rule_pages.py insists
# on it, because a page built without it prints the `:   value` lines as text.
markdown_extensions:
  - tables
  - def_list
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

# docs/rules.md is the rule summary the README links to on GitHub, and
# scripts/sync_rule_count.py writes into it, so it keeps its name and place. On
# the site it only did harm: with directory URLs it builds to rules/index.html,
# the same file as docs/rules/index.md, and whichever was written last won, so
# the page the nav called "Rule reference" never existed there and every link to
# it landed on the per-rule index. That index keeps rules/ (SARIF results already
# uploaded link to it), so the summary is the one left out. The hook in
# scripts/mkdocs_hooks.py and tests/test_rule_pages.py both fail if two built
# files ever share a destination again.
exclude_docs: |
  /rules.md
