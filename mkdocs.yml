site_name: AgentAuditKit Documentation
site_description: Security scanner for MCP-connected AI agent pipelines
site_url: https://sattyamjjain.github.io/agent-audit-kit/docs/
repo_url: https://github.com/sattyamjjain/agent-audit-kit
repo_name: agent-audit-kit

theme:
  name: material
  palette:
    primary: red
    accent: orange
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight

nav:
  - Home: index.md
  - Getting started:
      - Getting started: getting-started.md
      - CLI reference: cli.md
      - Configuration & rule schema: rule-schema.md
  - Rules & coverage:
      - Rule reference: rules.md
      - OWASP mapping: owasp-mapping.md
      - OWASP Agentic coverage: owasp-agentic-coverage.md
      - Session transcripts: session-transcripts.md
  - Compliance & evidence:
      - VEX and SBOM: vex.md
      - Why it works this way: why.md
  - CI/CD:
      - GitHub Action: github-action.md
      - CI/CD integration: ci-cd.md
      - GitLab CI: gitlab-ci.md
      - Azure Pipelines: azure-pipelines.md
      - CircleCI: circleci.md
  - Security & process:
      - Disclosure policy: disclosure-policy.md
      - CVE triage: cve-triage.md
      - CVE-to-rule latency: cve-latency.md
      - Releasing: RELEASING.md
      - Metrics: metrics.md
  - Research:
      - Coverage & crosswalk: STATE-OF-MCP-SECURITY-2026.md
      - 'The State of MCP Security, 2026 (corpus study)': research/state-of-mcp-2026/REPORT.md
      - Prevalence & score calibration: research/state-of-mcp-2026/PREVALENCE.md
      - Research log: research-log.md
  - Comparison: comparisons.md

# `research/state-of-mcp-2026/` lives outside docs/, so MkDocs cannot see it and
# the corpus study had no https address. The hook adds those files to the build
# from where they already are — one source of truth, no copy in the tree.
hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
