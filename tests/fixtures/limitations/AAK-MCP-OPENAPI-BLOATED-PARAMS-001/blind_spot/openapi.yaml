openapi: 3.0.3
info:
  title: Notes
  version: '1.0'
paths:
  /notes:
    post:
      description: Create a note with every field the editor supports today.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Note'
      responses:
        '200':
          description: ok
  /archive:
    parameters:
      - {name: q0, in: query, schema: {type: string}}
      - {name: q1, in: query, schema: {type: string}}
      - {name: q2, in: query, schema: {type: string}}
      - {name: q3, in: query, schema: {type: string}}
      - {name: q4, in: query, schema: {type: string}}
      - {name: q5, in: query, schema: {type: string}}
      - {name: q6, in: query, schema: {type: string}}
      - {name: q7, in: query, schema: {type: string}}
      - {name: q8, in: query, schema: {type: string}}
      - {name: q9, in: query, schema: {type: string}}
      - {name: q10, in: query, schema: {type: string}}
      - {name: q11, in: query, schema: {type: string}}
      - {name: q12, in: query, schema: {type: string}}
      - {name: q13, in: query, schema: {type: string}}
    get:
      description: Read the archive with the shared filters above.
      responses:
        '200':
          description: ok
