# Fixture for AAK-GHA-PUBLISH-GATE-001: anyone who can dispatch the workflow
# publishes the crate. Never run: it lives under tests/fixtures.
name: Publish crate
on: workflow_dispatch
jobs:
  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: |
          cargo test --locked
          cargo publish --locked \
            --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
