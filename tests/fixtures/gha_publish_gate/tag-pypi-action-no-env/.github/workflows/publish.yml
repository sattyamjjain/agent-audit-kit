# Fixture for AAK-GHA-PUBLISH-GATE-001: a tag push publishes to PyPI through
# trusted publishing with no environment. Never run: it lives under tests/fixtures.
name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install build && python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
