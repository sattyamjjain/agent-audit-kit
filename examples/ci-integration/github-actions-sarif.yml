# AgentAuditKit — GitHub Actions with SARIF Integration
# Copy this file to .github/workflows/agent-security.yml
#
# Findings appear in the GitHub Security tab and as inline PR annotations once
# the upload step below sends the action's SARIF to Code Scanning; the action
# writes SARIF but does not upload it. Requires: security-events: write.

name: MCP Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write
  contents: read

jobs:
  agent-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Option 1: Use the GitHub Action (recommended)
      - name: Run AgentAuditKit
        id: scan
        uses: sattyamjjain/agent-audit-kit@v0.6.34
        with:
          fail-on: high          # Fail the build on high+ severity findings
          format: sarif          # Write SARIF (the sarif-file output)

      - name: Upload SARIF to Code Scanning
        if: always()             # upload even when the scan failed the build
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif-file }}

      # Option 2: Use pip install (if you need more control)
