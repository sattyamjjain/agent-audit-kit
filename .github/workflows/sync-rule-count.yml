name: Sync rule count

# Keeps the generated count surfaces (rules.json, RULE_COUNT/SCANNER_COUNT,
# the README badge and anchors, action.yml, scanners.json, docs/rules.md and
# the anchored docs pages) in lockstep with the registry. Runs on every push
# to main that touches the rule or scanner source, then commits whatever
# drifted back.

on:
  push:
    branches: [main]
    paths:
      - rules.json
      - agent_audit_kit/rules/**
      - agent_audit_kit/bundle.py
      - agent_audit_kit/scanners/**
      - scripts/sync_rule_count.py
      - scripts/sync_scanner_count.py
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install agent-audit-kit
        run: pip install -e .

      - name: Regenerate bundle + sync surfaces
        id: sync
        run: python scripts/sync_rule_count.py --regenerate

      - name: Sync scanner-module count
        run: python scripts/sync_scanner_count.py

      - name: Check for drift
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'agent-audit-kit-bot'
          git config user.email 'agent-audit-kit-bot@users.noreply.github.com'
          # Stage every tracked file the two sync scripts rewrote: exactly what
          # the `git diff --quiet` drift check above saw. This used to name four
          # files while the scripts also write scanners.json, docs/rules.md and
          # the anchored docs pages, so a run that touched those would push a
          # partial sync and leave the rest drifting on main.
          git add -u
          git commit -m "chore(rule-count): auto-sync after rules.json change"
          git push
