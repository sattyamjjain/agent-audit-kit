name: Docker nightly rebuild

# Closes C13 — scheduled rebuild so the :latest and :nightly tags pick up
# base-image security patches without waiting for a release tag.

on:
  schedule:
    - cron: "23 3 * * *"   # 03:23 UTC daily (off-peak; random minute per fleet-hygiene)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # Required by github/codeql-action/upload-sarif. Its absence is why this
      # workflow went red for six consecutive nights (2026-08-16 .. 08-21) while the
      # image itself built and pushed fine every time -- only the Security-tab upload
      # failed. An explicit permissions block replaces the defaults rather than
      # extending them, so omitting this scope silently removed it.
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is built under QEMU, as in release.yml: an amd64-only image fails
      # `docker pull` on Apple Silicon and ARM runners.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag set
        id: tags
        run: |
          date_tag=$(date -u +%Y%m%d)
          echo "date_tag=${date_tag}" >> "$GITHUB_OUTPUT"

      - name: Build + push (latest + nightly + date tag)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true           # force re-pull of base image to catch upstream patches
          no-cache: true       # avoid cached base-image layers
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-audit-kit:latest
            ghcr.io/${{ github.repository_owner }}/agent-audit-kit:nightly
            ghcr.io/${{ github.repository_owner }}/agent-audit-kit:nightly-${{ steps.tags.outputs.date_tag }}
          labels: |
            org.opencontainers.image.title=AgentAuditKit
            org.opencontainers.image.description=Security scanner for MCP-connected AI agent pipelines
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/agent-audit-kit
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail if new CRITICAL/HIGH in base image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/agent-audit-kit:nightly
          format: sarif
          output: trivy-nightly.sarif
          severity: CRITICAL,HIGH
          # SARIF output lists every severity unless this is set, so `severity`
          # alone never filtered what reached the Security tab.
          limit-severities-for-sarif: true
          # A CVE with no fixed package in Debian's repositories is not one a
          # rebuild can clear; it is read again once Debian publishes the fix.
          ignore-unfixed: true

      # The documented one-liner on the image just pushed; release.yml runs the
      # same check before its push. A failure here files the scheduled-failure
      # issue below.
      - name: Smoke-test the documented docker run
        run: |
          set -euo pipefail
          img=ghcr.io/${{ github.repository_owner }}/agent-audit-kit:nightly
          docker run --rm "$img" --version
          docker run --rm --platform linux/arm64 "$img" --version
          docker run --rm -v "$PWD/tests/fixtures/cves/cve-2026-94044-mcp-route/vulnerable:/project:ro" \
            "$img" scan /project --format json --fail-on none > smoke.json
          python3 -c 'import json; ids = {f["ruleId"] for f in json.load(open("smoke.json"))["findings"]}; assert "AAK-MCP-015" in ids, sorted(ids)'

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-nightly.sarif
          category: trivy-nightly

      # ------------------------------------------------------------------
      # A scheduled workflow that fails silently is worse than one that does
      # not exist: the README keeps making the claim while nothing runs. This
      # files (or reuses) one issue so the next failure is visible without
      # anyone thinking to open the Actions tab.
      # ------------------------------------------------------------------
      - name: Report scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'scheduled-failure';
            const title = `Scheduled workflow failing: ${context.workflow}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `\`${context.workflow}\` failed on its schedule.`,
              ``,
              `- Run: ${url}`,
              `- Commit: ${context.sha}`,
              ``,
              `This issue is reused for repeat failures -- check the run log above for`,
              `the current cause. Close it once a scheduled run goes green.`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number,
                body: `Failed again: ${url}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            }
