name: Docker nightly rebuild

# Closes C13 — scheduled rebuild so the :latest and :nightly tags pick up
# base-image security patches without waiting for a release tag.

on:
  schedule:
    - cron: "23 3 * * *"   # 03:23 UTC daily (off-peak; random minute per fleet-hygiene)
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  # Required by github/codeql-action/upload-sarif. Its absence is why this
  # workflow went red for six consecutive nights (2026-08-16 .. 08-21) while the
  # image itself built and pushed fine every time -- only the Security-tab upload
  # failed. An explicit permissions block replaces the defaults rather than
  # extending them, so omitting this scope silently removed it.
  security-events: write
  issues: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag set
        id: tags
        run: |
          date_tag=$(date -u +%Y%m%d)
          echo "date_tag=${date_tag}" >> "$GITHUB_OUTPUT"

      - name: Build + push (latest + nightly + date tag)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true           # force re-pull of base image to catch upstream patches
          no-cache: true       # avoid cached base-image layers
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-audit-kit:latest
            ghcr.io/${{ github.repository_owner }}/agent-audit-kit:nightly
            ghcr.io/${{ github.repository_owner }}/agent-audit-kit:nightly-${{ steps.tags.outputs.date_tag }}
          labels: |
            org.opencontainers.image.title=AgentAuditKit
            org.opencontainers.image.description=Security scanner for MCP-connected AI agent pipelines
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/agent-audit-kit
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail if new CRITICAL/HIGH in base image)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/agent-audit-kit:nightly
          format: sarif
          output: trivy-nightly.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-nightly.sarif
          category: trivy-nightly

      # ------------------------------------------------------------------
      # A scheduled workflow that fails silently is worse than one that does
      # not exist: the README keeps making the claim while nothing runs. This
      # files (or reuses) one issue so the next failure is visible without
      # anyone thinking to open the Actions tab.
      # ------------------------------------------------------------------
      - name: Report scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'scheduled-failure';
            const title = `Scheduled workflow failing: ${context.workflow}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `\`${context.workflow}\` failed on its schedule.`,
              ``,
              `- Run: ${url}`,
              `- Commit: ${context.sha}`,
              ``,
              `This issue is reused for repeat failures -- check the run log above for`,
              `the current cause. Close it once a scheduled run goes green.`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number,
                body: `Failed again: ${url}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            }
