name: "Scorecard"

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        # Held at v2.4.3. v2.4.4 ships Scorecard v5.5.0, whose Vulnerabilities
        # check runs PyPI transitive resolution on every requirements file
        # without hashes (ossf/scorecard#5234). On the requirements fixtures
        # under tests/fixtures/cves/ it stopped finishing once #899 added six
        # more, and every push run hung until GitHub cancelled it. Leave v2.4.3
        # only for a release that ships the fix; dependabot.yml skips 2.4.4.
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        # The limit sits on the step, not the job. A job that runs out of time
        # is cancelled, and a cancelled run doesn't read as a failure, which is
        # how the hang above went unnoticed for five days. A step that runs out
        # of time fails the run. A healthy run takes under three minutes.
        timeout-minutes: 15
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
