name: Link check

# Catch a dead docs domain (the reason docs/CNAME -> docs.agentauditkit.io sat
# broken for months) at build time instead of after the fact. Runs on doc
# changes, on push to main, and weekly so a link that dies after merge still
# fails a build. `mailto:` links are excluded on purpose: security@agentauditkit.io
# is an aspirational contact whose domain is not registered yet, and we do not
# want the contact address to block docs builds.
#
# The MCP Security Index staleness guard lives here too, for the same reason: it
# is a claim in README.md that only the network can settle, and it decays
# silently. The index schedule failed every Monday from 2026-06-15 to 2026-08-21
# and nobody noticed for two months, because nothing failed when it stopped
# publishing.

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/link-check.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
  schedule:
    - cron: '23 6 * * 1'  # Mondays 06:23 UTC

permissions:
  contents: read

jobs:
  links:
    name: Check README + docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude 'mailto:|agentauditkit\.io|globenewswire\.com|asciinema\.org'
            --exclude-path 'docs/changelog/archive'
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            'README.md'
            'docs/**/*.md'
          fail: true

      # globenewswire.com is excluded above because lychee fails its HTTP/2
      # negotiation from the runner ("HTTP/2 protocol error. Server may not
      # support HTTP/2 properly") while the URL itself is alive — verified 200
      # over both HTTP/1.1 and HTTP/2 from outside CI. Excluding a live host is
      # normally the wrong call, so this is the narrow trade: one press-release
      # citation stays unchecked rather than the whole job staying red and
      # hiding real breakage. Revisit if lychee gains a per-host HTTP/1.1 flag.
      #
      # The deterministic half of this job — relative links to files in this
      # repo — is also covered by tests/test_docs_links.py, which fails fast and
      # locally and does not depend on the network at all.
      #
      # asciinema.org is excluded for the same reason, after the gentler fix was
      # tried and did not work: the README's demo embed times out from the runner
      # while answering 200 in ~0.9s from elsewhere, and raising --timeout from
      # 20s to 30s did not change it — so it is being throttled or blocked by
      # IP range, not merely slow. A timeout exits 2 exactly like a dead link, so
      # leaving it in makes the job permanently red.
      #
      # --timeout stays at 30 regardless: it is a reasonable default for the
      # remaining hosts and costs nothing.

  index-cadence:
    name: MCP Security Index is still publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Two failures, one command. The rendered "last published snapshot" date in
      # README.md must match the live history, AND that date must be at most 10
      # days old. On a Monday schedule 10 days tolerates exactly one missed week:
      # two consecutive misses fail the build instead of waiting to be noticed.
      - name: Check index cadence
        run: python scripts/index_cadence.py --check
